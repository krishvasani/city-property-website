name: Publish site

# Triggered by the "Go live" button in /cps-admin (via the GitHub API) or
# manually from the Actions tab. It tells Netlify to build and deploy the
# latest content from main. The Netlify build hook URL is stored as a repo
# secret, so it is never exposed in the website.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build and deploy
        run: |
          if [ -z "${{ secrets.NETLIFY_BUILD_HOOK }}" ]; then
            echo "NETLIFY_BUILD_HOOK secret is not set."; exit 1
          fi
          curl -fsS -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
          echo "Netlify build triggered. The site will be live in 1 to 2 minutes."
