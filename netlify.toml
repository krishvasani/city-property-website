# Netlify deploy config for City Property Services (Astro static + Netlify Forms)
[build]
  command = "npm run build"
  publish = "dist"
  # Only deploy when triggered by the CMS "Go live" hook. Ordinary commits
  # (saved edits) are skipped, so editors can batch many changes into one deploy.
  ignore = "bash scripts/should-build.sh"

[build.environment]
  # Astro 4 + several deps want Node >= 20.19; use current 22 LTS on Netlify.
  NODE_VERSION = "22"

# Long-cache hashed assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Canonical domain: 301 the old Netlify subdomain to cityprop.co.in so search
# engines and old links consolidate on one domain. (HTTP→HTTPS and www→apex are
# handled automatically by Netlify's primary-domain settings.)
[[redirects]]
  from = "https://city-property-ahmedabad.netlify.app/*"
  to = "https://cityprop.co.in/:splat"
  status = 301
  force = true

# Secondary domain: citypropertyservices.in is a redirecting mirror. Every
# request (apex + www) 301s to the matching path on cityprop.co.in, so the two
# names consolidate on one canonical site for SEO and branding.
# Prerequisite (dashboard + DNS, done once): add citypropertyservices.in and
# www.citypropertyservices.in as domain aliases on this Netlify site, and point
# their GoDaddy DNS at Netlify (apex A → 75.2.60.5; www CNAME →
# city-property-ahmedabad.netlify.app). Keep cityprop.co.in as the primary.
[[redirects]]
  from = "https://citypropertyservices.in/*"
  to = "https://cityprop.co.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.citypropertyservices.in/*"
  to = "https://cityprop.co.in/:splat"
  status = 301
  force = true

# NOTE on lead capture:
# Forms are plain HTML with data-netlify="true", so Netlify auto-detects them
# at build (forms: viewing, valuation, contact). After the first deploy, open
# Site settings → Forms → add an email notification to the owner's inbox so
# every submission is emailed instantly.
