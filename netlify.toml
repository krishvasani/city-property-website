# Netlify deploy config for City Property Services (Astro static + Netlify Forms)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 4 + several deps want Node >= 20.19; use current 22 LTS on Netlify.
  NODE_VERSION = "22"

# Long-cache hashed assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# NOTE on lead capture:
# Forms are plain HTML with data-netlify="true", so Netlify auto-detects them
# at build (forms: viewing, valuation, contact). After the first deploy, open
# Site settings → Forms → add an email notification to the owner's inbox so
# every submission is emailed instantly.
